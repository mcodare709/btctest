[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-perp-research"
version = "0.1.0"
description = "Cost-aware BTCUSDT perpetual futures backtesting baseline"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "websocket-client>=1.8",
]

[project.optional-dependencies]
ml = ["catboost>=1.2"]

[tool.setuptools.packages.find]
include = ["btc_perp*"]
