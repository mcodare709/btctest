[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-perp-research"
version = "0.1.0"
description = "Cost-aware BTCUSDT perpetual futures backtesting baseline"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.31",
    "scikit-learn>=1.3",
    "websocket-client>=1.8",
]

[project.optional-dependencies]
ml = ["catboost>=1.2"]
rl = ["gymnasium>=0.29.1,<1.3.0", "stable-baselines3==2.7.1", "sb3-contrib==2.7.0"]

[tool.setuptools.packages.find]
include = ["btc_perp*"]
